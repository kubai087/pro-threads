<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRO Threads — Live Light-Thread Wallpaper</title>
  <meta name="description" content="An animated WebGL wallpaper of letters woven from threads of light, inspired by the MacBook Pro PROLED XDR wallpaper. Full A–Z thread typeface, palettes and a live shader.">
  <meta name="theme-color" content="#07080b">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta property="og:title" content="PRO Threads — Live Light-Thread Wallpaper">
  <meta property="og:description" content="Letters woven from threads of light, rendered live in WebGL. Inspired by the MacBook Pro PROLED XDR wallpaper.">
  <meta property="og:image" content="https://www.kubai.design/pro-threads/media/pro.jpg">
  <meta property="og:url" content="https://www.kubai.design/pro-threads/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- The stage keeps the size chosen in the panel, letterboxed in the space left of it. -->
  <main class="view">
    <div class="stage">
      <canvas id="wall"></canvas>
      <img class="reference" alt="">
    </div>
  </main>

  <!-- Settings (Tweakpane). H hides it, ?ui=0 starts hidden, R shows the original, Space pauses. -->
  <aside class="sidebar"></aside>

  <script type="module" src="./wallpaper.js"></script>
</body>
</html>
