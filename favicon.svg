<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- The dim stem and the lit bowl, light falling from the top. -->
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf0f8"/>
      <stop offset="0.4" stop-color="#6c86a7"/>
      <stop offset="1" stop-color="#18202b"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fd"/>
      <stop offset="0.6" stop-color="#9db3cd"/>
      <stop offset="1" stop-color="#f1f5fa"/>
    </linearGradient>
    <!-- A glowing fibre: sky blue warming to amber and red. -->
    <linearGradient id="fibre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb8f5" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#5fb8f5"/>
      <stop offset="0.6" stop-color="#ffe2a0"/>
      <stop offset="0.8" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#e2332a" stop-opacity="0"/>
    </linearGradient>
    <!-- Fine threads. -->
    <pattern id="threads" width="2.6" height="64" patternUnits="userSpaceOnUse">
      <rect x="1.6" width="1" height="64" fill="#050608" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="64" height="64" rx="14" fill="#07080b"/>
  <!-- Stem, left of the slit. -->
  <path d="M13 47 V19 Q13 11 21 11 H30.4 V53 H19 Q13 53 13 47 Z" fill="url(#stem)"/>
  <!-- Bowl, right of the slit, sweeping left into a thin tip at its foot. -->
  <path d="M33.6 11 H44 Q51 11 51 18 V32.5 Q51 39 44.5 39 H25 Q33.6 38.6 33.6 31 Z" fill="url(#bowl)"/>
  <path d="M13 11 H51 V53 H13 Z" fill="url(#threads)"/>
  <!-- The warm glow where the bowl's light ends. -->
  <path d="M26.5 39 H44.5 Q49.6 39 50.7 35.8" fill="none" stroke="#ffad66" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="17" y="20" width="1.2" height="30" rx="0.6" fill="url(#fibre)"/>
</svg>
